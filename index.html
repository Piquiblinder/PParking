<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PParking</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card: white; }
        @media (prefers-color-scheme: dark) { :root { --bg: #121212; --text: #f0f0f0; --card: #1e1e1e; } }
        body { font-family: -apple-system, sans-serif; padding: 20px; text-align: center; background-color: var(--bg); color: var(--text); }
        button { display: block; width: 90%; margin: 12px auto; padding: 18px; border-radius: 12px; border: none; font-weight: bold; color: white; font-size: 16px; cursor: pointer; }
        #btnGuardar { background-color: #007bff; }
        #btnBorrar { background-color: #dc3545; }
        #btnAmpliar { background-color: #ff9800; }
        #btnFinAzul { background-color: #6c757d; }
        #btnNavegar { background-color: #28a745; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 15px; width: 80%; }
        #btnSi, #btnNo, #btnCancelar { width: 100%; margin: 10px 0; }
        #btnSi { background-color: #28a745; } 
        #btnNo { background-color: #007bff; } 
        #btnCancelar { background-color: #dc3545; }
        #resultado { margin-top: 20px; padding: 15px; background: var(--card); border-radius: 10px; }
    </style>
</head>
<body>
    <h1>PParking</h1>
    <button id="btnGuardar">Guardar Ubicación</button>
    <div id="controlesApp" style="display: none;">
        <button id="btnNavegar">¿Cómo llegar al coche?</button>
        <button id="btnAmpliar">+15 min Zona Azul</button>
        <button id="btnFinAzul">Finalizar Zona Azul</button>
        <button id="btnBorrar">Borrar Todo</button>
    </div>
    <div id="resultado"></div>

    <div id="modal">
        <div class="modal-content">
            <h3>PParking</h3>
            <p>¿Estás en un parking interior?</p>
            <button id="btnSi">Sí</button>
            <button id="btnNo">No</button>
            <button id="btnCancelar">Cancelar</button>
        </div>
    </div>

    <script>
        function actualizarPantalla() {
            const data = JSON.parse(localStorage.getItem('miCoche'));
            const res = document.getElementById('resultado');
            const controles = document.getElementById('controlesApp');
            
            if (data) {
                document.getElementById('btnGuardar').style.display = 'none';
                controles.style.display = 'block';
                
                let info = `<p><strong>Ubicación:</strong> ${data.nota}</p>`;
                if (data.finZonaAzul) {
                    const faltan = Math.round((new Date(data.finZonaAzul).getTime() - new Date().getTime()) / 60000);
                    info += faltan > 0 ? `<p><strong>Zona Azul:</strong> Quedan ${faltan} min</p>` : `<p style="color:red;">¡Tiempo agotado!</p>`;
                } else {
                    info += `<p><em>Zona azul no activada</em></p>`;
                }
                res.innerHTML = info;
            } else {
                document.getElementById('btnGuardar').style.display = 'block';
                controles.style.display = 'none';
                res.innerHTML = '<p>No hay aparcamiento guardado.</p>';
            }
        }

        // Flujo: Pregunta minutos -> Pregunta Ubicación
        function ejecutarGuardado(esInterior) {
            document.getElementById('modal').style.display = 'none';
            
            const min = prompt("Minutos de zona azul (0 si no aplica):");
            if (min === null) return; 

            let nota = esInterior ? prompt("Introduce planta y plaza:") : "Aparcado en exterior";
            if (nota === null) return;

            navigator.geolocation.getCurrentPosition((pos) => {
                const datos = {
                    lat: pos.coords.latitude, 
                    lon: pos.coords.longitude,
                    nota: nota,
                    finZonaAzul: parseInt(min) > 0 ? new Date(new Date().getTime() + parseInt(min)*60000) : null
                };
                localStorage.setItem('miCoche', JSON.stringify(datos));
                actualizarPantalla();
            });
        }

        document.getElementById('btnGuardar').onclick = () => document.getElementById('modal').style.display = 'flex';
        document.getElementById('btnCancelar').onclick = () => document.getElementById('modal').style.display = 'none';
        document.getElementById('btnSi').onclick = () => ejecutarGuardado(true);
        document.getElementById('btnNo').onclick = () => ejecutarGuardado(false);

        document.getElementById('btnNavegar').onclick = () => {
            const d = JSON.parse(localStorage.getItem('miCoche'));
            // URL estándar Google Maps
            window.location.href = `https://www.google.com/maps/search/?api=1&query=${d.lat},${d.lon}`;
        };

        document.getElementById('btnAmpliar').onclick = () => {
            const d = JSON.parse(localStorage.getItem('miCoche'));
            const baseTime = d.finZonaAzul ? new Date(d.finZonaAzul).getTime() : new Date().getTime();
            d.finZonaAzul = new Date(baseTime + 15 * 60000);
            localStorage.setItem('miCoche', JSON.stringify(d));
            actualizarPantalla();
        };

        document.getElementById('btnFinAzul').onclick = () => {
            const d = JSON.parse(localStorage.getItem('miCoche'));
            d.finZonaAzul = null;
            localStorage.setItem('miCoche', JSON.stringify(d));
            actualizarPantalla();
        };

        document.getElementById('btnBorrar').onclick = () => {
            if (confirm("¿Borrar todo el aparcamiento?")) {
                localStorage.removeItem('miCoche');
                actualizarPantalla();
            }
        };

        // Registro del Service Worker y Permiso de Notificaciones
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('SW registrado');
                        if (Notification.permission !== 'granted') {
                            Notification.requestPermission();
                        }
                    })
                    .catch(err => console.log('Error:', err));
            });
        }

        setInterval(actualizarPantalla, 60000);
        actualizarPantalla();
    </script>
</body>
</html>
