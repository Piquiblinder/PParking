<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Parking</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; text-align: center; background-color: #f4f4f9; 
        }
        button { 
            display: block; width: 90%; margin: 15px auto; padding: 20px; 
            font-size: 18px; border-radius: 12px; border: none; font-weight: bold; color: white;
        }
        #btnGuardar { background-color: #007bff; }
        #btnBorrar { background-color: #dc3545; }
        #btnNavegar { background-color: #28a745; }
        #resultado { 
            margin-top: 20px; padding: 15px; background: white; 
            border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>
    <h1>Mi Coche</h1>
    <button id="btnGuardar">Guardar Ubicación</button>
    <button id="btnNavegar" style="display: none;">¿Cómo llegar al coche?</button>
    <button id="btnBorrar" style="display: none;">Borrar Aparcamiento</button>
    <div id="resultado"></div>

    <script>
        function actualizarPantalla() {
            const data = JSON.parse(localStorage.getItem('miCoche'));
            const btnGuardar = document.getElementById('btnGuardar');
            const btnBorrar = document.getElementById('btnBorrar');
            const btnNavegar = document.getElementById('btnNavegar');
            const res = document.getElementById('resultado');

            if (data) {
                btnGuardar.style.display = 'none';
                btnBorrar.style.display = 'block';
                btnNavegar.style.display = 'block';
                
                // Configurar el botón de navegación
                btnNavegar.onclick = () => {
                    window.location.href = `https://www.google.com/maps/search/?api=1&query=${data.lat},${data.lon}`;
                };

                res.innerHTML = `<h3>Ubicación guardada:</h3><p>${data.nota || 'Coordenadas GPS guardadas'}</p>`;
            } else {
                btnGuardar.style.display = 'block';
                btnBorrar.style.display = 'none';
                btnNavegar.style.display = 'none';
                res.innerHTML = '<p>No hay aparcamiento guardado.</p>';
            }
        }

        document.getElementById('btnGuardar').addEventListener('click', () => {
            const esInterior = confirm("¿Estás en un parking interior?");
            let nota = "";
            if (esInterior) {
                nota = prompt("Introduce planta y plaza (Ej: Planta -2, Plaza B14):");
            }
            
            navigator.geolocation.getCurrentPosition((pos) => {
                const datos = { lat: pos.coords.latitude, lon: pos.coords.longitude, nota: nota };
                localStorage.setItem('miCoche', JSON.stringify(datos));
                actualizarPantalla();
                alert("¡Ubicación guardada!");
            }, (error) => { alert("Error: Asegúrate de tener la ubicación activada."); });
        });

        document.getElementById('btnBorrar').addEventListener('click', () => {
            if (confirm("¿Borrar aparcamiento?")) {
                localStorage.removeItem('miCoche');
                actualizarPantalla();
            }
        });

        actualizarPantalla();
    </script>
</body>
</html>
