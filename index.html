<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Parking</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f4f4f9; }
        button { display: block; width: 90%; margin: 15px auto; padding: 20px; font-size: 18px; border-radius: 12px; border: none; font-weight: bold; }
        #btnGuardar { background-color: #007bff; color: white; }
        #btnBorrar { background-color: #dc3545; color: white; }
        /* Esta clase oculta botones */
        .oculto { display: none !important; }
        #resultado { margin-top: 20px; padding: 15px; background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Mi Coche</h1>
    <button id="btnGuardar">Guardar Ubicación</button>
    <button id="btnBorrar" class="oculto">Borrar Aparcamiento</button>
    <div id="resultado"></div>

    <script>
        function actualizarPantalla() {
            const data = JSON.parse(localStorage.getItem('miCoche'));
            const btnGuardar = document.getElementById('btnGuardar');
            const btnBorrar = document.getElementById('btnBorrar');
            const res = document.getElementById('resultado');

            if (data) {
                // Hay datos: ocultamos guardar, mostramos borrar
                btnGuardar.classList.add('oculto');
                btnBorrar.classList.remove('oculto');
                res.innerHTML = `<h3>Ubicación guardada:</h3><p>${data.nota || 'Coordenadas GPS guardadas'}</p>`;
            } else {
                // No hay datos: mostramos guardar, ocultamos borrar
                btnGuardar.classList.remove('oculto');
                btnBorrar.classList.add('oculto');
                res.innerHTML = '<p>No hay aparcamiento guardado.</p>';
            }
        }

        document.getElementById('btnGuardar').addEventListener('click', () => {
            const esInterior = confirm("¿Estás en un parking interior?");
            let nota = "";
            if (esInterior) {
                nota = prompt("Introduce planta y plaza (Ej: Planta -2, Plaza B14):");
            }
            
            navigator.geolocation.getCurrentPosition((pos) => {
                const datos = { lat: pos.coords.latitude, lon: pos.coords.longitude, nota: nota };
                localStorage.setItem('miCoche', JSON.stringify(datos));
                actualizarPantalla();
                alert("¡Guardado!");
            }, (error) => { alert("Error de ubicación: " + error.message); });
        });

        document.getElementById('btnBorrar').addEventListener('click', () => {
            if (confirm("¿Borrar aparcamiento?")) {
                localStorage.removeItem('miCoche');
                actualizarPantalla();
            }
        });

        actualizarPantalla();
    </script>
</body>
</html>
